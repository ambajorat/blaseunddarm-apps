# =====================================================================
# project.yml — Blase & Darm Manager — VOLLSTÄNDIG (02.08.2026)
# Vier Targets: iOS-App, Widget/Live-Activity-Extension, Watch-App,
# Watch-Komplikation (WidgetKit). Komplikations-ID: …watchkitapp.Komplikation
# =====================================================================

name: BlaseUndDarm
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"

settings:
  MARKETING_VERSION: "4.0"
  CURRENT_PROJECT_VERSION: "5"
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: GDYQYL67XG

targets:

  # ---------------------------------------------------------------
  # iPhone-App
  # ---------------------------------------------------------------
  BlaseUndDarm:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    resources:
      - path: Resources
    dependencies:
      - target: BDMWidgetExtension
      - target: BlaseUndDarmWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: blase-und-darm.Blase-und-Darm
      PRODUCT_NAME: Blase und Darm
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: BlaseUndDarm.entitlements
      TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Blase & Darm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true

  # ---------------------------------------------------------------
  # Widget + Live Activity (Extension)
  # ---------------------------------------------------------------
  BDMWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BDMWidget
      - path: Shared/WidgetData.swift
      - path: Shared/Models.swift
      - path: Shared/SharedDataStore.swift
      - path: App/LiveActivity.swift
      - path: App/AppColors.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: blase-und-darm.Blase-und-Darm.BDMWidgetExtension
      PRODUCT_NAME: BDMWidgetExtension
      CODE_SIGN_ENTITLEMENTS: BDMWidgetExtension.entitlements
      SKIP_INSTALL: YES
      TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: BDMWidget/Info.plist
      properties:
        CFBundleDisplayName: Blase & Darm Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ---------------------------------------------------------------
  # Watch-App
  # ---------------------------------------------------------------
  BlaseUndDarmWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "Info.plist"
      - path: Shared/Models.swift
      - path: Shared/WidgetData.swift
    dependencies:
      - target: BDMWatchWidgetExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: blase-und-darm.Blase-und-Darm.watchkitapp
      PRODUCT_NAME: Blase und Darm Watch
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Blase & Darm
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: blase-und-darm.Blase-und-Darm
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: BlaseUndDarmWatch.entitlements
      TARGETED_DEVICE_FAMILY: "4"

  # ---------------------------------------------------------------
  # Watch-Komplikation (WidgetKit-Extension fürs Zifferblatt)
  # ---------------------------------------------------------------
  BDMWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidget
        excludes:
          - "Info.plist"
      - path: Shared/WidgetData.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: blase-und-darm.Blase-und-Darm.watchkitapp.Komplikation
      PRODUCT_NAME: BDMWatchWidgetExtension
      CODE_SIGN_ENTITLEMENTS: BDMWatchWidgetExtension.entitlements
      SKIP_INSTALL: YES
      TARGETED_DEVICE_FAMILY: "4"
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Blase & Darm Komplikation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  BlaseUndDarm:
    build:
      targets:
        BlaseUndDarm: all
    run:
      config: Debug
